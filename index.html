<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Stars</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        'primary-hover': '#4f46e5',
                    },
                    animation: {
                        'float': 'float 8s ease-in-out infinite',
                        'pulse-glow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'scale-up': 'scaleUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'check-draw': 'checkDraw 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-15px)' },
                        },
                        scaleUp: {
                            '0%': { transform: 'scale(0.8)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' },
                        },
                        checkDraw: {
                            '0%': { strokeDashoffset: '48' },
                            '100%': { strokeDashoffset: '0' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .dynamic-bg {
            background: linear-gradient(135deg, #060913, #0b1120, #090d19, #050810);
            background-size: 300% 300%;
            animation: gradientAnimation 20s ease infinite;
        }

        .checkmark-path {
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
        }
        .animate-check {
            animation: checkDraw 0.6s cubic-bezier(0.65, 0, 0.45, 1) 0.2s forwards;
        }
    </style>
</head>
<body class="dynamic-bg text-slate-100 min-h-screen flex m-0 p-0 overflow-x-hidden relative">

    <!-- Blur Overlay Modal (Waiting / Success) -->
    <div id="payment-modal" class="fixed inset-0 z-50 backdrop-blur-xl bg-slate-950/80 flex items-center justify-center p-6 hidden transition-all duration-500">
        <div class="max-w-md w-full text-center relative animate-scale-up space-y-6">
            
            <!-- Waiting State -->
            <div id="modal-waiting" class="space-y-6">
                <div class="relative w-20 h-20 mx-auto">
                    <div class="absolute inset-0 rounded-full border-4 border-indigo-500/20"></div>
                    <div class="absolute inset-0 rounded-full border-4 border-indigo-600 border-t-transparent animate-spin"></div>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-white mb-2">Waiting for Payment</h2>
                    <p class="text-sm text-slate-400">Complete the payment in the opened Cryptobot tab. Once paid, stars will be credited instantly.</p>
                </div>
                <div class="pt-2">
                    <button type="button" id="cancel-order-btn" class="w-full py-3 px-6 bg-slate-800/80 hover:bg-slate-700 text-slate-300 font-medium rounded-xl transition duration-200 border border-slate-700/50">
                        Cancel Order
                    </button>
                </div>
            </div>

            <!-- Success State -->
            <div id="modal-success" class="space-y-6 hidden">
                <div>
                    <h2 class="text-xl font-bold text-white mb-1">Payment Successful!</h2>
                    <p class="text-sm text-slate-400">Your stars have been credited to your account.</p>
                    <div id="success-stars-count" class="mt-4 inline-flex items-center space-x-2 text-indigo-400 font-bold text-2xl">
                        <span>+100</span>
                        <span>⭐</span>
                    </div>
                </div>
                <div class="pt-2">
                    <button type="button" id="close-modal-btn" class="w-full py-3.5 px-6 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl transition duration-200 shadow-lg shadow-indigo-600/30">
                        Close
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- Left-side payment panel -->
    <aside class="w-full md:w-[480px] lg:w-[520px] min-h-screen bg-[#070b14]/95 border-r border-slate-800/60 flex flex-col justify-between p-8 sm:p-12 z-10">
        <div>
            <!-- Header with pure icon and title -->
            <div class="flex items-center space-x-4 mb-8">
                <img src="icon.png" alt="Logo" class="w-10 h-10 object-contain rounded-xl" onerror="this.src='https://api.iconify.design/lucide:sparkles.svg?color=%236366f1'">
                <div>
                    <h1 class="text-xl font-bold text-white tracking-tight">Buy Stars</h1>
                    <p class="text-xs text-slate-400">Secure instant top-up via Cryptobot Testnet</p>
                </div>
            </div>

            <!-- Discord User Profile Preview -->
            <div id="user-profile" class="hidden flex items-center space-x-3.5 p-3.5 bg-slate-900/40 border border-slate-800/60 rounded-2xl mb-6">
                <img id="user-avatar" src="" alt="Avatar" class="w-11 h-11 rounded-full object-cover bg-slate-800">
                <div class="overflow-hidden">
                    <div id="user-display-name" class="text-sm font-semibold text-white truncate"></div>
                    <div id="user-tag" class="text-xs text-slate-400 font-mono truncate"></div>
                </div>
            </div>

            <form id="payment-form" class="space-y-6">
                <!-- Discord ID Field -->
                <div>
                    <label for="discord-id" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Discord Account ID</label>
                    <div class="relative">
                        <input type="text" id="discord-id" name="discord_id" required readonly
                            class="w-full px-4 py-3 bg-slate-900/60 border border-slate-800/80 rounded-xl text-slate-300 text-sm focus:outline-none cursor-not-allowed font-mono tracking-wide">
                        <div class="absolute right-3.5 top-3 text-[11px] font-medium text-slate-500 bg-slate-800/60 px-2 py-0.5 rounded-md">AUTO</div>
                    </div>
                </div>

                <!-- Number of Stars Field -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label for="stars-amount" class="block text-xs font-semibold uppercase tracking-wider text-slate-400">Number of Stars</label>
                        <span id="price-display" class="text-xs font-semibold text-indigo-400">≈ $0.00 USD</span>
                    </div>
                    <div class="relative">
                        <input type="number" id="stars-amount" name="stars" min="1" value="100" required
                            class="w-full px-4 py-3 bg-slate-900/60 border border-slate-800 rounded-xl text-white text-base font-semibold focus:outline-none focus:border-indigo-500 transition duration-200">
                        <div class="absolute right-4 top-3.5 text-lg select-none pointer-events-none">⭐</div>
                    </div>
                </div>

                <!-- Quick Preset Buttons -->
                <div>
                    <span class="block text-[11px] font-semibold uppercase tracking-wider text-slate-500 mb-2">Quick Select</span>
                    <div class="grid grid-cols-4 gap-2">
                        <button type="button" data-amount="50" class="preset-btn py-2 px-3 bg-slate-900/40 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 text-xs font-medium rounded-xl text-slate-300 transition duration-200">50 ⭐</button>
                        <button type="button" data-amount="100" class="preset-btn py-2 px-3 bg-slate-900/40 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 text-xs font-medium rounded-xl text-slate-300 transition duration-200">100 ⭐</button>
                        <button type="button" data-amount="250" class="preset-btn py-2 px-3 bg-slate-900/40 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 text-xs font-medium rounded-xl text-slate-300 transition duration-200">250 ⭐</button>
                        <button type="button" data-amount="500" class="preset-btn py-2 px-3 bg-slate-900/40 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 text-xs font-medium rounded-xl text-slate-300 transition duration-200">500 ⭐</button>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit"
                    class="w-full py-3.5 px-6 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl transition duration-200 flex items-center justify-center space-x-2">
                    <span>Proceed to Cryptobot Payment</span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                </button>
            </form>

            <div id="status-message" class="mt-4 text-center text-sm font-medium transition-all duration-300"></div>
        </div>

        <div class="text-xs text-slate-500 pt-6">
            <span>Discord NFT bot</span>
        </div>
    </aside>

    <!-- Right-side background area with animated ambient glow -->
    <main class="hidden md:flex flex-1 items-center justify-center relative overflow-hidden p-12">
        <div class="absolute w-[500px] h-[500px] bg-indigo-600/10 rounded-full blur-[140px] animate-pulse-glow pointer-events-none"></div>
        <div class="absolute w-[350px] h-[350px] bg-purple-600/10 rounded-full blur-[120px] animate-float pointer-events-none" style="animation-delay: -3s;"></div>
    </main>

    <script>
        const PRIMARY_BACKEND = 'https://gifts-api.duckdns.org:8011';
        const FALLBACK_BACKEND = 'http://localhost:3030';
        let BACKEND_URL = PRIMARY_BACKEND;

        let starRate = 0.05;
        let pollingInterval = null;
        let currentInvoiceId = null;
        let paymentWindowRef = null;

        const urlParams = new URLSearchParams(window.location.search);
        const discordId = urlParams.get('id');
        const discordInput = document.getElementById('discord-id');

        if (discordId) {
            discordInput.value = discordId;
        } else {
            discordInput.value = 'Not specified';
        }

        const amountInput = document.getElementById('stars-amount');
        const priceDisplay = document.getElementById('price-display');
        const presetBtns = document.querySelectorAll('.preset-btn');
        const paymentModal = document.getElementById('payment-modal');
        const modalWaiting = document.getElementById('modal-waiting');
        const modalSuccess = document.getElementById('modal-success');
        const cancelOrderBtn = document.getElementById('cancel-order-btn');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const successStarsCount = document.getElementById('success-stars-count');

        function updatePriceAndPresets() {
            const val = parseInt(amountInput.value) || 0;
            const totalUSD = (val * starRate).toFixed(2);
            priceDisplay.textContent = `≈ $${totalUSD} USD`;

            presetBtns.forEach(btn => {
                if (parseInt(btn.getAttribute('data-amount')) === val) {
                    btn.classList.add('border-indigo-500', 'bg-indigo-600/10', 'text-white');
                    btn.classList.remove('border-slate-800', 'bg-slate-900/40', 'text-slate-300');
                } else {
                    btn.classList.remove('border-indigo-500', 'bg-indigo-600/10', 'text-white');
                    btn.classList.add('border-slate-800', 'bg-slate-900/40', 'text-slate-300');
                }
            });
        }

        async function fetchRate() {
            try {
                let res = await fetch(`${PRIMARY_BACKEND}/api/rate`).catch(() => null);
                if (!res || !res.ok) {
                    BACKEND_URL = FALLBACK_BACKEND;
                    res = await fetch(`${FALLBACK_BACKEND}/api/rate`);
                }
                if (res && res.ok) {
                    const data = await res.json();
                    if (data && typeof data.rate === 'number') {
                        starRate = data.rate;
                    }
                }
            } catch (e) {
                console.warn('Could not fetch rate', e);
            }
            updatePriceAndPresets();
        }

        presetBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                amountInput.value = btn.getAttribute('data-amount');
                updatePriceAndPresets();
            });
        });

        amountInput.addEventListener('input', updatePriceAndPresets);
        fetchRate();

        function startPolling(invoiceId, starsCount) {
            currentInvoiceId = invoiceId;
            if (pollingInterval) clearInterval(pollingInterval);

            pollingInterval = setInterval(async () => {
                try {
                    const res = await fetch(`${BACKEND_URL}/api/invoice-status?id=${invoiceId}`);
                    if (res.ok) {
                        const data = await res.json();
                        if (data && data.status === 'paid') {
                            clearInterval(pollingInterval);
                            pollingInterval = null;

                            // Show success state in modal
                            modalWaiting.classList.add('hidden');
                            modalSuccess.classList.remove('hidden');
                            successStarsCount.innerHTML = `<span>+${starsCount}</span><span>⭐</span>`;
                        }
                    }
                } catch (e) {
                    console.error('Polling error:', e);
                }
            }, 3000); // Poll every 3 seconds
        }

        cancelOrderBtn.addEventListener('click', () => {
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
            if (paymentWindowRef && !paymentWindowRef.closed) {
                paymentWindowRef.close();
            }
            paymentModal.classList.add('hidden');
            document.getElementById('status-message').textContent = '';
        });

        closeModalBtn.addEventListener('click', () => {
            paymentModal.classList.add('hidden');
            modalSuccess.classList.add('hidden');
            modalWaiting.classList.remove('hidden');
            document.getElementById('status-message').textContent = '';
        });

        document.getElementById('payment-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = discordInput.value;
            const stars = amountInput.value;
            const statusDiv = document.getElementById('status-message');

            if (!id || id === 'Not specified') {
                statusDiv.textContent = '⚠️ Error: Discord Account ID is required (pass ?id=... in URL)';
                statusDiv.className = 'mt-4 text-center text-sm text-red-400 font-semibold';
                return;
            }

            statusDiv.textContent = 'Creating Cryptobot invoice...';
            statusDiv.className = 'mt-4 text-center text-sm text-indigo-400 font-medium animate-pulse';

            // Open tab immediately
            paymentWindowRef = window.open('about:blank', '_blank');

            try {
                let response = await fetch(`${BACKEND_URL}/api/pay`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ id: id, stars: parseInt(stars, 10) })
                }).catch(() => null);

                if (!response || !response.ok) {
                    BACKEND_URL = (BACKEND_URL === PRIMARY_BACKEND) ? FALLBACK_BACKEND : PRIMARY_BACKEND;
                    response = await fetch(`${BACKEND_URL}/api/pay`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ id: id, stars: parseInt(stars, 10) })
                    });
                }

                if (!response.ok) {
                    throw new Error('Backend payment request failed');
                }

                const data = await response.json();
                if (data && data.pay_url) {
                    statusDiv.textContent = '';
                    if (paymentWindowRef) {
                        paymentWindowRef.location.href = data.pay_url;
                    } else {
                        window.location.href = data.pay_url;
                    }

                    // Show blur overlay modal & start polling
                    modalSuccess.classList.add('hidden');
                    modalWaiting.classList.remove('hidden');
                    paymentModal.classList.remove('hidden');

                    startPolling(data.invoice_id, parseInt(stars, 10));
                } else {
                    if (paymentWindowRef) paymentWindowRef.close();
                    throw new Error('Invalid payment response');
                }
            } catch (err) {
                if (paymentWindowRef) paymentWindowRef.close();
                statusDiv.textContent = '⚠️ Failed to connect to payment backend. Please ensure backend is running.';
                statusDiv.className = 'mt-4 text-center text-sm text-red-400 font-medium';
            }
        });
    </script>
</body>
</html>
